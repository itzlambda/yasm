name: CI

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2

      - uses: extractions/setup-just@v4

      - name: Run quality gate
        run: just lint
